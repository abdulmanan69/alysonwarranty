# Local development database only. The app itself runs with `npm run dev`.
#   npm run db:up      start PostgreSQL on localhost:5434
#   npm run db:down    stop it (data is kept in the volume)
name: alyson
services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: alyson
      POSTGRES_PASSWORD: alyson_dev
      POSTGRES_DB: alyson
    ports:
      - "127.0.0.1:5434:5432"
    volumes:
      - alyson-dev-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U alyson -d alyson"]
      interval: 3s
      timeout: 3s
      retries: 20

volumes:
  alyson-dev-data:
